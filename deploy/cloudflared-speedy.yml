# cloudflared configuration for the Speedy origin.
#
# This tunnel ("speedy-game") is separate from the one the control panel uses.
# Its ingress rules are managed on the Cloudflare side (remote config):
#   speedy-origin.<your-domain>  ->  http://127.0.0.1:8080
# Change ingress in the dashboard or through the API, not here, or the local
# file and the remote config will disagree.

tunnel: 09437374-4836-4680-a7d0-1141c1c19129
credentials-file: /etc/cloudflared/speedy-game.json

# Set this to debug while troubleshooting
loglevel: info
# Metrics stay on loopback: curl 127.0.0.1:20242/metrics
metrics: 127.0.0.1:20242

retries: 5
grace-period: 30s

no-autoupdate: true
