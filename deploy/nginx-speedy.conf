# Optional Nginx reverse proxy for Speedy.
#
# The default deployment uses a Cloudflare Tunnel: cloudflared points
# speedy-origin.<your-domain> at 127.0.0.1:8080, so no Nginx, no open ports and
# no certificate are needed.
#
# Use this file only if you want the VPS reachable without Cloudflare.

upstream speedy_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name speedy.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name speedy.example.com;

    ssl_certificate     /etc/letsencrypt/live/speedy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speedy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Game packets are tiny, compression is not worth it
    gzip off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # --- WebSocket channel ---------------------------------------------
    # Upgrade and Connection must reach the upstream, and the timeouts must be
    # long, or Nginx will close an idle connection.
    location /ws {
        proxy_pass http://speedy_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # --- Static files and API --------------------------------------------
    location / {
        proxy_pass http://speedy_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
