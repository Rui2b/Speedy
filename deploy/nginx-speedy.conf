# Speedy 的 Nginx 反向代理配置(可选)。
#
# 说明:本方案默认走 Cloudflare Tunnel,由 cloudflared 直接把
# speedy-origin.potatoedu.cc 指向本机 127.0.0.1:8080,不需要 Nginx,
# 也不需要开放 80/443 或申请证书。
#
# 只有在你想"不经过 Cloudflare"直连 VPS 时,才启用这份配置。

upstream speedy_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name speedy.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name speedy.example.com;

    ssl_certificate     /etc/letsencrypt/live/speedy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speedy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # 游戏包很小,压缩开销不值得
    gzip off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # --- WebSocket 通道 -------------------------------------------------
    # 关键:必须把 Upgrade/Connection 头透传给上游,并放长超时,
    # 否则连接会被 nginx 按空闲超时掐断。
    location /ws {
        proxy_pass http://speedy_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # --- 静态资源与 API -------------------------------------------------
    location / {
        proxy_pass http://speedy_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
